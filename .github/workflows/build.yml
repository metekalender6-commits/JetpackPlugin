name: Build Jetpack Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu al
        uses: actions/checkout@v4

      - name: .NET 10 SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bağımlılıkları geri yükle
        run: dotnet restore JetpackPlugin.csproj

      - name: Release olarak derle
        run: dotnet build JetpackPlugin.csproj -c Release --no-restore

      - name: Derlenen DLL'i artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: JetpackPlugin-dll
          path: bin/Release/net10.0/
          if-no-files-found: error
